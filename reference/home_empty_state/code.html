<div class="flex items-center p-4 pb-2 justify-between sticky top-0 z-10 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm">

<div class="flex items-center gap-1.5 opacity-80">

<h1 class="text-gray-900 dark:text-white text-2xl sm:text-3xl font-extrabold leading-tight tracking-tight">
                        No habits yet
                    </h1>
<p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-relaxed max-w-[320px]">

</div>

<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-6 bg-primary hover:bg-primary/90 active:scale-[0.98] transition-all duration-200 shadow-lg shadow-primary/20">
<span class="flex items-center gap-2 text-background-dark text-base font-bold leading-normal tracking-[0.015em]">
<span class="material-symbols-outlined text-xl font-bold">add</span>

                    </span>
