<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>How Points Work</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee6c",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-dark": "#1a2e22", // Slightly lighter than background-dark for cards
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        "glow": "0 0 40px -5px rgba(43, 238, 108, 0.4)",
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased selection:bg-primary selection:text-black">
<div class="relative flex min-h-screen w-full flex-col overflow-hidden max-w-md mx-auto shadow-2xl">
<!-- Header / Illustration Area -->
<div class="flex-1 flex flex-col items-center justify-center pt-12 pb-6 px-6">
<!-- Abstract Glowy Symbol -->
<div class="relative mb-8 group">
<div class="absolute inset-0 bg-primary rounded-full blur-[60px] opacity-20 group-hover:opacity-30 transition-opacity duration-500"></div>
<div class="relative flex items-center justify-center w-24 h-24 rounded-full bg-surface-dark border border-white/10 shadow-glow">
<span class="material-symbols-outlined text-primary text-5xl">stars</span>
</div>
</div>
<!-- Headline -->
<h2 class="text-3xl font-bold tracking-tight text-center mb-2">How Scoring Works</h2>
<p class="text-slate-500 dark:text-slate-400 text-center max-w-[280px]">Build streaks to earn points. Keep the momentum going.</p>
</div>
<!-- Rules Cards -->
<div class="flex-1 px-5 flex flex-col gap-4 justify-start">
<!-- Rule 1: Progress -->
<div class="group flex items-center justify-between p-4 bg-white dark:bg-surface-dark border border-slate-200 dark:border-white/5 rounded-2xl shadow-sm transition-transform hover:scale-[1.02] active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 dark:bg-primary/20 text-primary">
<span class="material-symbols-outlined">check_circle</span>
</div>
<div>
<p class="font-semibold text-sm text-slate-900 dark:text-slate-100">Completing habits</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Standard progress</p>
</div>
</div>
<div class="text-right">
<span class="block font-bold text-primary text-lg tracking-tight">+10 pts</span>
</div>
</div>
<!-- Rule 2: Bonus -->
<div class="group flex items-center justify-between p-4 bg-white dark:bg-surface-dark border border-slate-200 dark:border-white/5 rounded-2xl shadow-sm transition-transform hover:scale-[1.02] active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 dark:bg-primary/20 text-primary">
<span class="material-symbols-outlined">bolt</span>
</div>
<div>
<p class="font-semibold text-sm text-slate-900 dark:text-slate-100">Finishing before noon</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Early bird bonus</p>
</div>
</div>
<div class="text-right">
<span class="block font-bold text-primary text-lg tracking-tight">+5 bonus</span>
</div>
</div>
<!-- Rule 3: Penalty -->
<div class="group flex items-center justify-between p-4 bg-white dark:bg-surface-dark border border-slate-200 dark:border-white/5 rounded-2xl shadow-sm transition-transform hover:scale-[1.02] active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-rose-500/10 dark:bg-rose-500/20 text-rose-500">
<span class="material-symbols-outlined">warning</span>
</div>
<div>
<p class="font-semibold text-sm text-slate-900 dark:text-slate-100">Missing a deadline</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Break the chain</p>
</div>
</div>
<div class="text-right">
<span class="block font-bold text-rose-500/80 text-lg tracking-tight">−2 pts</span>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="p-6 pb-8 mt-auto flex flex-col items-center gap-5 w-full">
<!-- Disclaimer -->
<div class="flex items-center gap-2 opacity-60">
<span class="material-symbols-outlined text-sm">info</span>
<p class="text-xs font-medium">Don't worry, penalties are tiny.</p>
</div>
<!-- Main Action Button -->
<button class="w-full h-14 bg-primary text-background-dark font-bold text-lg rounded-full shadow-[0_0_20px_-5px_rgba(43,238,108,0.4)] hover:shadow-[0_0_25px_-5px_rgba(43,238,108,0.6)] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Got it</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</div>
</body></html>
