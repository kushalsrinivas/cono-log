<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Habit - Basics</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee6c",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-dark": "#1c2e22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem", 
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        /* Custom scrollbar hiding for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-white flex flex-col font-display selection:bg-primary selection:text-background-dark">
<!-- Header / Top Bar -->
<header class="flex items-center justify-between p-4 pt-6 pb-2 sticky top-0 z-10 bg-background-light dark:bg-background-dark/95 backdrop-blur-sm">
<button aria-label="Cancel" class="text-slate-900 dark:text-white flex size-12 shrink-0 items-center justify-center hover:bg-black/5 dark:hover:bg-white/10 rounded-full transition-colors">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">New Habit</h2>
<div class="flex items-center justify-end px-2">
<p class="text-[#9db9a6] text-sm font-bold leading-normal tracking-[0.015em] shrink-0">Step 1 of 3</p>
</div>
</header>
<!-- Progress Bar -->
<div class="w-full h-1 bg-gray-200 dark:bg-surface-dark mt-1">
<div class="h-full w-1/3 bg-primary rounded-r-full shadow-[0_0_10px_rgba(43,238,108,0.5)]"></div>
</div>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-6 py-6 max-w-md mx-auto w-full">
<!-- Input Section -->
<section class="mb-10 animate-[fadeIn_0.5s_ease-out]">
<label class="flex flex-col w-full gap-3">
<span class="text-slate-900 dark:text-white text-xl font-semibold leading-normal">What do you want to achieve?</span>
<div class="relative group">
<input autofocus="" class="w-full bg-white dark:bg-surface-dark border-2 border-transparent focus:border-primary text-slate-900 dark:text-white placeholder:text-gray-400 dark:placeholder:text-[#5a7061] h-16 px-5 rounded-xl text-lg font-medium outline-none ring-0 transition-all shadow-sm" placeholder="e.g., Read 10 pages" type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-primary opacity-0 group-focus-within:opacity-100 transition-opacity pointer-events-none">
<span class="material-symbols-outlined">edit</span>
</div>
</div>
<p class="text-sm text-[#9db9a6] flex items-center gap-1.5 mt-1">
<span class="material-symbols-outlined text-[16px] text-primary">auto_awesome</span>
                    Small steps earn big points.
                </p>
</label>
</section>
<!-- Category Section -->
<section class="flex-1 animate-[fadeIn_0.6s_ease-out_0.1s_both]">
<h3 class="text-slate-900 dark:text-white tracking-tight text-lg font-bold leading-tight mb-4">Category</h3>
<div class="flex gap-3 flex-wrap">
<!-- Selected Chip -->
<button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-primary pl-3 pr-4 shadow-[0_0_15px_rgba(43,238,108,0.25)] transition-transform active:scale-95">
<span class="material-symbols-outlined text-background-dark text-[20px]">favorite</span>
<p class="text-background-dark text-sm font-bold leading-normal">Health</p>
</button>
<!-- Unselected Chips -->
<button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-white dark:bg-surface-dark hover:bg-gray-100 dark:hover:bg-[#25382b] pl-3 pr-4 border border-gray-200 dark:border-transparent transition-colors active:scale-95">
<span class="material-symbols-outlined text-slate-600 dark:text-white text-[20px] group-hover:text-primary transition-colors">fitness_center</span>
<p class="text-slate-600 dark:text-white text-sm font-medium leading-normal">Fitness</p>
</button>
<button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-white dark:bg-surface-dark hover:bg-gray-100 dark:hover:bg-[#25382b] pl-3 pr-4 border border-gray-200 dark:border-transparent transition-colors active:scale-95">
<span class="material-symbols-outlined text-slate-600 dark:text-white text-[20px] group-hover:text-primary transition-colors">school</span>
<p class="text-slate-600 dark:text-white text-sm font-medium leading-normal">Learning</p>
</button>
<button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-white dark:bg-surface-dark hover:bg-gray-100 dark:hover:bg-[#25382b] pl-3 pr-4 border border-gray-200 dark:border-transparent transition-colors active:scale-95">
<span class="material-symbols-outlined text-slate-600 dark:text-white text-[20px] group-hover:text-primary transition-colors">work</span>
<p class="text-slate-600 dark:text-white text-sm font-medium leading-normal">Work</p>
</button>
<button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-white dark:bg-surface-dark hover:bg-gray-100 dark:hover:bg-[#25382b] pl-3 pr-4 border border-gray-200 dark:border-transparent transition-colors active:scale-95">
<span class="material-symbols-outlined text-slate-600 dark:text-white text-[20px] group-hover:text-primary transition-colors">self_improvement</span>
<p class="text-slate-600 dark:text-white text-sm font-medium leading-normal">Mindfulness</p>
</button>
<!-- Custom Add Chip -->
<button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg border border-dashed border-gray-400 dark:border-[#5a7061] hover:border-primary dark:hover:border-primary pl-3 pr-4 bg-transparent transition-colors active:scale-95">
<span class="material-symbols-outlined text-gray-500 dark:text-[#9db9a6] text-[20px] group-hover:text-primary transition-colors">add</span>
<p class="text-gray-500 dark:text-[#9db9a6] text-sm font-medium leading-normal group-hover:text-primary transition-colors">Custom</p>
</button>
</div>
</section>
</main>
<!-- Bottom Action Area -->
<!-- Positioned for easy thumb access, slightly raised from bottom for "floating" feel on iOS -->
<footer class="p-6 sticky bottom-0 w-full bg-gradient-to-t from-background-light dark:from-background-dark via-background-light dark:via-background-dark to-transparent pt-12">
<div class="max-w-md mx-auto">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary hover:bg-[#25e665] text-background-dark text-[17px] font-bold leading-normal tracking-[0.015em] transition-all shadow-lg shadow-primary/20 active:scale-[0.98]">
<span class="truncate mr-2">Next Step</span>
<span class="material-symbols-outlined text-[20px] font-bold">arrow_forward</span>
</button>
</div>
</footer>
</body></html>
