<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings - Minimalist Habit Tracker</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee6c",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2c20",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl">
<!-- TopAppBar -->
<div class="sticky top-0 z-50 flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 pb-2 justify-between border-b border-black/5 dark:border-white/5">
<button class="text-slate-900 dark:text-white flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] text-center">Settings</h2>
<div class="size-10 shrink-0"></div> <!-- Spacer for centering -->
</div>
<main class="flex-1 px-5 py-6 flex flex-col gap-8">
<!-- Section: Mechanics -->
<section class="flex flex-col gap-3">
<h3 class="text-slate-500 dark:text-gray-400 text-xs font-bold uppercase tracking-wider px-2">Consequences</h3>
<!-- SegmentedButtons -->
<div class="flex h-12 w-full items-center justify-center rounded-xl bg-slate-200 dark:bg-[#1a2c20] p-1 shadow-inner">
<label class="group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 transition-all duration-200 has-[:checked]:bg-white dark:has-[:checked]:bg-[#2bee6c] has-[:checked]:shadow-sm">
<span class="truncate text-sm font-medium text-slate-500 dark:text-slate-400 group-has-[:checked]:text-slate-900 dark:group-has-[:checked]:text-[#102216]">Light</span>
<input class="invisible w-0 absolute" name="penalty_intensity" type="radio" value="Light"/>
</label>
<label class="group flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 transition-all duration-200 has-[:checked]:bg-white dark:has-[:checked]:bg-[#2bee6c] has-[:checked]:shadow-sm">
<span class="truncate text-sm font-medium text-slate-500 dark:text-slate-400 group-has-[:checked]:text-slate-900 dark:group-has-[:checked]:text-[#102216]">Normal</span>
<input checked="" class="invisible w-0 absolute" name="penalty_intensity" type="radio" value="Normal"/>
</label>
</div>
<!-- Helper Text -->
<p class="text-slate-500 dark:text-gray-400 text-sm font-normal leading-relaxed px-2">
                    Normal mode doubles point loss for missed habits. Choose wisely.
                </p>
</section>
<!-- Section: System -->
<section class="flex flex-col gap-3">
<h3 class="text-slate-500 dark:text-gray-400 text-xs font-bold uppercase tracking-wider px-2">System</h3>
<div class="flex flex-col overflow-hidden rounded-xl bg-white dark:bg-[#1a2c20] shadow-sm ring-1 ring-black/5 dark:ring-white/5">
<!-- About Row -->
<button class="flex w-full items-center justify-between p-4 text-left transition-colors hover:bg-slate-50 dark:hover:bg-white/5 active:bg-slate-100 dark:active:bg-white/10 group">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-8 rounded-full bg-slate-100 dark:bg-white/10 text-slate-600 dark:text-white">
<span class="material-symbols-outlined text-[20px]">info</span>
</div>
<span class="text-base font-medium text-slate-900 dark:text-white">About</span>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors text-[20px]">chevron_right</span>
</button>
<!-- Divider -->
<div class="h-px w-full bg-slate-100 dark:bg-white/5 ml-14"></div>
<!-- Reset Row -->
<button class="flex w-full items-center justify-between p-4 text-left transition-colors hover:bg-red-50 dark:hover:bg-red-500/10 active:bg-red-100 dark:active:bg-red-500/20 group">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-8 rounded-full bg-red-100 dark:bg-red-500/20 text-red-600 dark:text-red-400">
<span class="material-symbols-outlined text-[20px]">delete_forever</span>
</div>
<span class="text-base font-medium text-red-600 dark:text-red-400">Reset all data</span>
</div>
</button>
</div>
</section>
</main>
<!-- Footer / Version -->
<div class="p-6 mt-auto">
<div class="flex flex-col items-center justify-center gap-1">
<span class="material-symbols-outlined text-slate-300 dark:text-white/20 text-3xl">offline_bolt</span>
<p class="text-xs text-slate-400 dark:text-white/30 font-medium text-center">
                    Version 1.0 (Offline Build)
                </p>
</div>
</div>
</div>
<!-- Toggle Dark Mode Helper for Preview (Optional: Remove in production) -->

        // Simple script to demonstrate dark mode toggling if viewing in browser
        // In a real app, this would be handled by system preference or user setting
        const html = document.documentElement;

        // html.classList.add('dark');
    </script>
</body></html>
