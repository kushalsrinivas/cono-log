<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log Progress Modal</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee6c",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-dark": "#1a2c20",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    keyframes: {
                        'pulse-slow': {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.6' },
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar hiding */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark text-white h-screen w-full overflow-hidden relative selection:bg-primary selection:text-background-dark">
<!-- BACKGROUND CONTEXT (Blurred Habit Detail Screen) -->
<div class="absolute inset-0 z-0 flex flex-col opacity-30 blur-[2px] pointer-events-none transform scale-[0.98]">
<!-- Fake Header -->
<div class="px-4 py-6 flex items-center justify-between">
<div class="size-10 rounded-full bg-surface-dark flex items-center justify-center">
<span class="material-symbols-outlined text-white">arrow_back</span>
</div>
<div class="size-10 rounded-full bg-surface-dark flex items-center justify-center">
<span class="material-symbols-outlined text-white">more_horiz</span>
</div>
</div>
<!-- Fake Content -->
<div class="px-6 space-y-8 mt-4">
<div class="flex flex-col items-center">
<div class="size-32 rounded-full border-4 border-primary/20 flex items-center justify-center mb-4">
<span class="text-4xl font-bold text-white">38%</span>
</div>
<h1 class="text-2xl font-bold text-white">Drink Water</h1>
<p class="text-white/50">Daily Goal: 8 Cups</p>
</div>
<!-- Fake Calendar Grid -->
<div class="grid grid-cols-7 gap-3 opacity-50">
<div class="aspect-square rounded-lg bg-primary/20"></div>
<div class="aspect-square rounded-lg bg-primary"></div>
<div class="aspect-square rounded-lg bg-primary"></div>
<div class="aspect-square rounded-lg bg-surface-dark border border-white/5"></div>
<div class="aspect-square rounded-lg bg-surface-dark border border-white/5"></div>
<div class="aspect-square rounded-lg bg-surface-dark border border-white/5"></div>
<div class="aspect-square rounded-lg bg-surface-dark border border-white/5"></div>
</div>
<!-- Fake List -->
<div class="space-y-3 opacity-50">
<div class="h-16 w-full bg-surface-dark rounded-xl"></div>
<div class="h-16 w-full bg-surface-dark rounded-xl"></div>
<div class="h-16 w-full bg-surface-dark rounded-xl"></div>
</div>
</div>
</div>
<!-- MODAL OVERLAY -->
<div class="absolute inset-0 z-10 bg-black/40 backdrop-blur-sm transition-opacity"></div>
<!-- MODAL -->
<div class="absolute inset-x-0 bottom-0 z-20 flex flex-col justify-end h-[85vh]">
<div class="w-full h-full bg-background-dark border-t border-white/10 rounded-t-[32px] shadow-[0_-8px_40px_rgba(0,0,0,0.6)] flex flex-col relative overflow-hidden">
<!-- Handle -->
<div class="w-full flex justify-center pt-5 pb-2 shrink-0 cursor-grab active:cursor-grabbing">
<div class="w-12 h-1.5 bg-white/20 rounded-full"></div>
</div>
<!-- Header Section -->
<div class="px-6 pt-4 pb-6 text-center shrink-0">
<p class="text-primary/70 text-xs font-bold tracking-[0.2em] uppercase mb-3">Log Activity</p>
<h2 class="text-white text-[32px] font-bold tracking-tight leading-tight">Drink Water</h2>
<div class="flex items-center justify-center gap-2 mt-2 text-white/40 text-sm font-medium">
<span class="material-symbols-outlined text-[18px]">local_fire_department</span>
<span>Streak: 5 Days</span>
</div>
</div>
<!-- Main Interaction Area -->
<div class="flex-1 flex flex-col justify-center px-6">
<!-- Stepper Control -->
<div class="flex items-center justify-between gap-4 mb-10">
<!-- Decrease -->
<button class="group size-16 rounded-full bg-surface-dark border border-white/5 flex items-center justify-center text-white transition-all active:scale-90 hover:border-primary/30 shadow-lg">
<span class="material-symbols-outlined text-3xl text-white/70 group-hover:text-white">remove</span>
</button>
<!-- Value Display -->
<div class="flex-1 flex flex-col items-center justify-center select-none">
<div class="relative">
<span class="text-[80px] font-bold text-white tabular-nums tracking-tighter leading-none">1</span>
<!-- Subtle indicator for change -->
<div class="absolute top-2 -right-6 text-primary font-bold text-lg animate-pulse-slow">+</div>
</div>
<span class="text-white/40 text-lg font-medium mt-1 uppercase tracking-wide">Cup</span>
</div>
<!-- Increase -->
<button class="group size-16 rounded-full bg-primary text-background-dark flex items-center justify-center transition-all active:scale-90 shadow-[0_0_20px_rgba(43,238,108,0.25)] hover:shadow-[0_0_30px_rgba(43,238,108,0.4)]">
<span class="material-symbols-outlined text-4xl font-bold">add</span>
</button>
</div>
<!-- Live Feedback Card -->
<div class="bg-surface-dark/50 border border-white/5 rounded-2xl p-5 backdrop-blur-sm">
<!-- Points & Text -->
<div class="flex justify-between items-end mb-4">
<div>
<p class="text-white/50 text-xs uppercase tracking-wider font-semibold mb-1">Impact</p>
<div class="flex items-center gap-1.5 text-primary">
<span class="material-symbols-outlined text-xl fill-1">bolt</span>
<span class="text-xl font-bold">+5 pts</span>
</div>
</div>
<div class="text-right">
<p class="text-white/90 text-sm font-medium">Goal Progress</p>
<p class="text-white/40 text-xs">3 <span class="mx-1">→</span> <span class="text-white">4</span> / 8</p>
</div>
</div>
<!-- Enhanced Progress Bar -->
<div class="relative h-4 w-full bg-black/40 rounded-full overflow-hidden shadow-inner">
<!-- Current Progress (Static) -->
<div class="absolute left-0 top-0 h-full bg-white/20 w-[37%] rounded-l-full border-r border-black/20" title="Current Progress"></div>
<!-- Anticipated Progress (Active/Animated) -->
<div class="absolute left-[37%] top-0 h-full bg-primary w-[12.5%] rounded-r-full shadow-[0_0_10px_rgba(43,238,108,0.5)] flex items-center justify-end pr-1" title="Projected Increase">
<div class="h-full w-full bg-white/20 animate-pulse"></div>
</div>
<!-- Goal Marker (Optional visual aid) -->
<div class="absolute right-[10%] top-0 h-full w-[2px] bg-white/5"></div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="p-6 pb-10 bg-background-dark mt-auto shrink-0 relative">
<!-- Gradient fade at top of footer to blend -->
<div class="absolute -top-12 left-0 w-full h-12 bg-gradient-to-t from-background-dark to-transparent pointer-events-none"></div>
<button class="w-full bg-primary text-background-dark font-display font-bold text-[17px] h-14 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-3 group relative overflow-hidden">
<!-- Button content -->
<span class="relative z-10">Confirm Log</span>
<span class="material-symbols-outlined relative z-10 text-[22px] group-hover:translate-x-1 transition-transform">check_circle</span>
<!-- Shine effect on hover -->
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 rounded-xl z-0"></div>
</button>
</div>
</div>
</div>
</body></html>
