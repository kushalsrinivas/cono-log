<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Goal Completed Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee6c",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom blur for the background simulation */
        .backdrop-blur-custom {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden">
<!-- Main Container -->
<div class="relative flex h-screen w-full flex-col overflow-hidden">
<!-- Simulated Background Content (To give context of 'overlay') -->
<!-- This section creates the illusion that the modal is floating over the app -->
<div aria-hidden="true" class="absolute inset-0 flex flex-col gap-4 p-4 opacity-30 pointer-events-none">
<div class="flex justify-between items-center mb-4">
<div class="h-8 w-8 rounded-full bg-gray-700"></div>
<div class="h-6 w-32 rounded bg-gray-700"></div>
<div class="h-8 w-8 rounded-full bg-gray-700"></div>
</div>
<div class="h-40 w-full rounded-2xl bg-gray-800/50"></div>
<div class="h-24 w-full rounded-xl bg-gray-800/30"></div>
<div class="h-24 w-full rounded-xl bg-gray-800/30"></div>
<div class="h-24 w-full rounded-xl bg-gray-800/30"></div>
</div>
<!-- Modal Overlay -->
<div class="z-50 flex h-full w-full items-center justify-center bg-black/60 backdrop-blur-custom p-4">
<!-- Modal Card -->
<div class="relative flex w-full max-w-[340px] flex-col items-center rounded-3xl bg-[#16211a] p-6 shadow-2xl ring-1 ring-white/10 dark:ring-white/5">
<!-- Success Iconography (Modified from EmptyState) -->
<div class="flex flex-col items-center gap-6 w-full">
<!-- Animated-style Checkmark Container -->
<div class="flex h-24 w-24 items-center justify-center rounded-full bg-primary/10 ring-1 ring-primary/20 shadow-[0_0_30px_-10px_rgba(43,238,108,0.4)]">
<span class="material-symbols-outlined text-[64px] text-primary" style="font-variation-settings: 'FILL' 1, 'wght' 700;">
                            check
                        </span>
</div>
<!-- Text Content -->
<div class="flex max-w-[480px] flex-col items-center gap-1 w-full">
<!-- Headline -->
<h2 class="text-white text-2xl font-bold leading-tight tracking-tight text-center">
                            Goal Achieved!
                        </h2>
<!-- Reward Badge (MetaText adaptation) -->
<div class="flex items-center gap-1 py-2">
<span class="material-symbols-outlined text-primary text-lg">bolt</span>
<p class="text-primary text-lg font-bold leading-normal text-center">+50 Bonus Points</p>
</div>
<!-- Description -->
<p class="text-gray-400 text-sm font-medium leading-relaxed text-center px-2">
                            You have successfully completed <br/><span class="text-white font-semibold">'Morning Run'</span> for 30 days.
                        </p>
</div>
</div>
<!-- Status Indicator (Chips adaptation) -->
<div class="flex gap-3 py-6 flex-wrap justify-center w-full">
<div class="flex h-7 shrink-0 items-center justify-center gap-x-1.5 rounded-full bg-white/5 ring-1 ring-white/10 pl-3 pr-3">
<span class="material-symbols-outlined text-[16px] text-gray-400">task_alt</span>
<p class="text-gray-300 text-xs font-semibold uppercase tracking-wider leading-normal">Completed</p>
</div>
</div>
<!-- Action Buttons (ButtonGroup adaptation) -->
<div class="flex w-full flex-col gap-3 items-stretch pt-2">
<!-- Primary Action -->
<button class="group flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-background-dark text-base font-bold leading-normal tracking-wide shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
<span class="flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">replay</span>
                            Restart Habit
                        </span>
</button>
<!-- Secondary Action -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-transparent border border-white/10 text-white hover:bg-white/5 text-base font-medium leading-normal tracking-wide transition-all active:scale-[0.98]">
<span class="flex items-center gap-2">
<span class="material-symbols-outlined text-[20px] text-gray-400">archive</span>
                            Archive Habit
                        </span>
</button>
</div>
</div>
</div>
</div>
</body></html>
