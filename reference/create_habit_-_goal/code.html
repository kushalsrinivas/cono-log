<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Habit - Goal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#2bee6c",
              "background-light": "#f6f8f6",
              "background-dark": "#102216",
              "surface-dark": "#1a2c20",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        /* Hide number input spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        
        .toggle-checkbox:checked {
            right: 0;
            border-color: #2bee6c;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #2bee6c;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen font-display text-slate-900 dark:text-white flex flex-col overflow-hidden relative">
<!-- Top Navigation -->
<header class="flex items-center justify-between px-4 py-4 z-10">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex-1 text-center">
<span class="text-sm font-semibold tracking-wide text-gray-500 dark:text-gray-400 uppercase">Create Habit</span>
</div>
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors opacity-0 pointer-events-none">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Progress Indicators -->
<div class="w-full flex justify-center gap-3 py-2 mb-2">
<!-- Step 1: Completed -->
<div class="h-1.5 w-8 rounded-full bg-primary/40"></div>
<!-- Step 2: Active -->
<div class="h-1.5 w-8 rounded-full bg-primary shadow-[0_0_8px_rgba(43,238,108,0.6)]"></div>
<!-- Step 3: Pending -->
<div class="h-1.5 w-8 rounded-full bg-gray-300 dark:bg-gray-700"></div>
<!-- Step 4: Pending -->
<div class="h-1.5 w-8 rounded-full bg-gray-300 dark:bg-gray-700"></div>
</div>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-6 max-w-md mx-auto w-full">
<!-- Headline -->
<div class="py-4">
<h1 class="text-3xl font-extrabold leading-tight tracking-tight mb-2">How do you measure success?</h1>
<p class="text-gray-500 dark:text-gray-400 text-sm">Choose how you'll track your progress daily.</p>
</div>
<!-- Segmented Control -->
<div class="mt-4 mb-8">
<div class="flex p-1.5 rounded-2xl bg-gray-200 dark:bg-surface-dark relative">
<!-- Selection Indicator (Visual only, would be animated in JS) -->
<label class="flex-1 relative cursor-pointer group">
<input class="peer sr-only" name="goal_type" type="radio" value="repetition"/>
<div class="flex flex-col items-center justify-center py-3 px-2 rounded-xl transition-all duration-300 peer-checked:bg-primary peer-checked:text-background-dark peer-checked:shadow-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200">
<span class="material-symbols-outlined mb-1 text-2xl">check_circle</span>
<span class="text-xs font-bold uppercase tracking-wide">Repetition</span>
</div>
</label>
<label class="flex-1 relative cursor-pointer group">
<input checked="" class="peer sr-only" name="goal_type" type="radio" value="time"/>
<div class="flex flex-col items-center justify-center py-3 px-2 rounded-xl transition-all duration-300 peer-checked:bg-primary peer-checked:text-background-dark peer-checked:shadow-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200">
<span class="material-symbols-outlined mb-1 text-2xl">timer</span>
<span class="text-xs font-bold uppercase tracking-wide">Duration</span>
</div>
</label>
</div>
</div>
<!-- Hero Input Section -->
<div class="flex-1 flex flex-col items-center justify-center min-h-[200px]">
<div class="relative w-full text-center">
<label class="sr-only" for="target-amount">Target Amount</label>
<div class="inline-flex items-baseline justify-center relative">
<!-- The input is styled to look like just text. The caretaker color matches primary. -->
<input class="block w-40 bg-transparent border-0 border-b-2 border-transparent focus:border-primary p-0 text-center text-8xl font-black tracking-tighter text-slate-900 dark:text-white focus:ring-0 placeholder-gray-700 caret-primary transition-colors selection:bg-primary/30" id="target-amount" min="1" type="number" value="30"/>
<span class="text-xl font-medium text-gray-400 dark:text-gray-500 ml-2 absolute -right-12 bottom-6">min</span>
</div>
<p class="text-sm font-medium text-primary mt-4 tracking-wide uppercase">Daily Goal</p>
</div>
</div>
<!-- Helper / Consequence Text -->
<div class="mt-auto mb-8 bg-surface-dark/50 border border-primary/10 rounded-xl p-4 flex items-start gap-3 backdrop-blur-sm">
<div class="p-1.5 bg-primary/20 rounded-full text-primary shrink-0">
<span class="material-symbols-outlined text-lg block" style="font-variation-settings: 'FILL' 1;">stars</span>
</div>
<div>
<p class="text-sm text-gray-300 font-medium">Point Reward</p>
<p class="text-xs text-gray-500 mt-0.5 leading-relaxed">Hitting this target daily earns you <span class="text-white font-bold">50 points</span> towards your level up.</p>
</div>
</div>
<!-- Spacer for fixed button -->
<div class="h-24"></div>
</main>
<!-- Sticky Footer Button -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent pt-12">
<button class="w-full bg-primary hover:bg-[#25d360] active:scale-[0.98] transition-all text-background-dark font-bold text-lg h-14 rounded-full shadow-[0_4px_20px_rgba(43,238,108,0.25)] flex items-center justify-center gap-2 group mx-auto max-w-md">
<span>Next Step</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</body></html>
